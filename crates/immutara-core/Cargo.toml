[package]
name = "immutara-core"
version = "0.1.0"
edition = "2024"
description = "Domain types, provider traits, and error handling for Immutara"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
toml = "0.8"
