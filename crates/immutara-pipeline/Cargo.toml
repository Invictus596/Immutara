[package]
name = "immutara-pipeline"
version = "0.1.0"
edition = "2024"
description = "Pipeline orchestration, processing stages, and provider implementations"

[dependencies]
immutara-core = { path = "../immutara-core" }
tokio = { version = "1", features = ["rt", "time", "sync", "fs", "io-util", "process"] }
tracing = "0.1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls"] }
http = "1"
alloy = { version = "2.4", default-features = false, features = ["essentials", "reqwest", "reqwest-rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync"] }
