# Default Immutara configuration.
#
# Provider implementations (mock now; Python CV later) are selected here.
# No API keys or sensitive data belong in committed config.

[pipeline]
evidence_dir = "./evidence"
log_level = "info"

[verification.policy]
version = 1
min_search_matches = 0
min_search_similarity = 0.0
require_analysis = false
min_analysis_confidence = 0.0
# required_providers = []

# Search stage. `provider` selects the implementation:
#   "mock"   - deterministic, no external dependencies (default dev path)
#   "tineye" - real reverse-image-search over the public web (TinEye API)
[search]
provider = "mock"

# Settings for the "tineye" provider. The API key is read from the
# TINEYE_API_KEY environment variable (never committed here). When unset and
# require_real_key = false, the public TinEye sandbox key is used — it returns
# real HTTP results, but always for the sample "melon cat" image regardless of
# the uploaded file. For genuine submission validation, set require_real_key = true:
# [search.tineye]
# require_real_key = true
# timeout_seconds = 60

# Analysis stage. `provider` selects the implementation:
#   "mock"   - deterministic, no external dependencies (default dev path)
#   "opencv" - real YuNet + SFace face analysis via a Python worker
[analysis]
provider = "mock"

# Settings for the "opencv" provider. These defaults (below) are used when the
# table is omitted; uncomment and adjust to enable real CV analysis.
# [analysis.opencv]
# models_dir = "./models"
# python_package_dir = "./py"
# python = "python3"
# worker_module = "immutara_cv.face_worker"
# detection_threshold = 0.9
# max_image_dimension = 4096
# timeout_seconds = 30

[attestation]
provider = "mock"
