# Default Immutara configuration.
#
# In this skeleton phase only provider identifiers are declared. Provider
# implementations (mock now; Python CV / EVM / genuine search later) are
# selected here. No API keys or sensitive data belong in committed config.

[pipeline]
evidence_dir = "./evidence"
log_level = "info"

[verification.policy]
version = 1
min_search_matches = 0
min_search_similarity = 0.0
require_analysis = false
min_analysis_confidence = 0.0
# required_providers = []

[search]
provider = "mock"

[analysis]
provider = "mock"

[attestation]
provider = "mock"
